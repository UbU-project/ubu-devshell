# Pinned revs for Phase 1 upstream repos.
#
# Record the expected HEAD SHA here each time an upstream repo lands.
# D1 ticket R_* notation → key mapping:
#   R_schemas      → ubu_schemas
#   R_core         → ubu_core
#   R_store        → ubu_store
#   R_planning     → ubu_planning_kernel
#   R_adapter      → ubu_github_adapter
#   R_orchestrator → ubu_orchestrator
#   R_ui           → ubu_ui
#
# Leave a value as "" when a repo has not yet landed.
# show-revs.sh compares these against local checkout HEADs, and checks that
# each pinned commit is on a branch of origin. Push a branch before pinning it.

[pinned]
ubu_schemas         = "070d0a6f9a6ad7833dd523042925008316ce923b"  # P1B-70 published branch
ubu_core            = "fa26bf678977f5e077229eb97a39cc1b8b960c9b"  # P1B-70 published branch
ubu_store           = "83a099f55220b1286ffb2dee3c9d19006e2090b5"  # P1B-70 published branch
ubu_planning_kernel = "8653cf2bbe96cd7cf0337fd857881be6665d1ceb"  # P1B-79 published per-step occupancy bound / exact feasibility
ubu_github_adapter  = "e14a43b47aeb0a928f4dfdc83cd78ea9a2e044f6"  # P1B-70 published branch
ubu_orchestrator = "c140f80be90e1bb78c899eb6fb3e834dc09d1f5d"  # P1B-79 published kernel consumer pins
