# Pinned revs for Phase 1 upstream repos.
#
# Record the expected HEAD SHA here each time an upstream repo lands.
# D1 ticket R_* notation → key mapping:
#   R_schemas      → ubu_schemas
#   R_core         → ubu_core
#   R_store        → ubu_store
#   R_planning     → ubu_planning_kernel
#   R_adapter      → ubu_github_adapter
#   R_orchestrator → ubu_orchestrator
#   R_ui           → ubu_ui
#
# Leave a value as "" when a repo has not yet landed.
# show-revs.sh compares these against local checkout HEADs, and checks that
# each pinned commit is on a branch of origin. Push a branch before pinning it.

[pinned]
ubu_schemas         = "6082ad50680e38a7140e52ed4d8b8377efbc3b2c"  # P1B-60 A: string summaries and a whole-state round-trip fixture
ubu_core            = "8ffc936257331c50cd03773c9d1333a3344cf4cc"  # P1B-60 B: schema submodule and whole-state compatibility; 158 tests
ubu_store           = "a6ae9b82170b03e231a196d1b9341bfa0e20fce8"  # P1B-60 C: core pin only; 108 tests
ubu_planning_kernel = "072867285ba267bb9caee28a12fb33c6ede51c2b"  # P1B-60 C: core pin only; 83 tests
ubu_github_adapter  = "999e0e2f50388db6c5b999449c8620c750f288cf"  # P1B-60 C: core pin only; 23 tests
ubu_orchestrator    = "84c00c55f5a9782a85c35eac6b6b701e8af64491"  # P1B-60 C/D: matching placements exclude retained history; 513 tests, 56 paths
ubu_ui              = "78eab141c5b1fd806385fd6ae5b2592a3b6f832f"  # P1B-60 E/F: matching-placement clause and numeric precondition words; 156 tests, 43 paths
ubu_design          = "f7c4a1dbe2979fa498ae115bb2ee74e6772d4c2c"  # P1B-41 H: unchanged design baseline; inventory previously unset
ubu_brand           = "faf2005a8bd9e64742dd76ee6d1f91f45223946b"  # P1B-41 H: unchanged brand baseline; inventory previously unset
